[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars-proc-compare"
version = "0.1.0"
authors = [
    { name="Your Name", email="your.email@example.com" },
]
description = "High-performance dataset comparison using Polars"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "polars>=0.19.0",
    "numpy>=1.24.0",
    "jinja2>=3.0.0",
    "psutil>=5.9.0",
    "jupyterlab>=4.0.0"
]

[project.urls]
"Homepage" = "https://github.com/yourusername/polars-proc-compare"
"Bug Tracker" = "https://github.com/yourusername/polars-proc-compare/issues"

[tool.hatch.build.targets.wheel]
packages = ["polars_proc_compare"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''/(.*\.ipynb)'''
